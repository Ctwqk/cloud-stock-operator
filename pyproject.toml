[project]
name = "cloud-stock-operator"
version = "0.2.0"
description = "Serverless news-driven trading/watchlist system on AWS (CDK, Lambda, SNS/SQS, DynamoDB, S3)"
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies of the CDK app (cdk/). Lambda handlers run on the Lambda Python runtime,
# which already ships boto3; their extra libraries are built into layers (layers/*.txt).
dependencies = [
    "aws-cdk-lib>=2.200,<3",
    "constructs>=10,<11",
]

[dependency-groups]
# Libraries the Lambda handlers import (boto3 comes with the Lambda runtime; the rest live in layers).
lambda = [
    "boto3>=1.34",
    "vaderSentiment>=3.3.2",
    "matplotlib>=3.8",
]
# The local demo: web UI, trade worker and the moto-based AWS stand-in (local_app/).
local = [
    "boto3>=1.34",
    "Flask>=3.0",
    "requests>=2.32",
    "moto[server,dynamodb,s3,sns,sqs,sts]>=5.0,<6",
    "matplotlib>=3.8",
    "vaderSentiment>=3.3.2",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    { include-group = "lambda" },
    { include-group = "local" },
]
lint = ["ruff>=0.8"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lambda", "cdk", "local_app"]
addopts = "-ra --strict-markers"
markers = ["slow: synthesizes CDK stacks (starts a Node.js jsii process, a few seconds)"]
filterwarnings = [
    "ignore::DeprecationWarning:jsii.*",
    "ignore::DeprecationWarning:botocore.*",
    "ignore::DeprecationWarning:moto.*",
    "ignore::DeprecationWarning:aws_cdk.*",
]

[tool.coverage.run]
source = ["lambda", "local_app", "cdk"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cdk.out", "layers/build", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "RUF012",  # mutable class attributes: used for plain data holders
]

[tool.ruff.lint.isort]
known-first-party = [
    "common", "news_fetcher", "news_writer", "sentiment_scorer", "stock_info_writer",
    "soft_delete", "networth_plotter", "networth_snapshot_writer", "news_retention_cleaner",
    "control_plane_api", "local_cloud", "infra_stack", "web_app", "local_trade_worker",
]

[tool.ruff.lint.per-file-ignores]
"local_app/web_app.py" = ["E501"]  # inline HTML/CSS template
